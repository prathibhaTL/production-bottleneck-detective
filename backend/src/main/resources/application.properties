# --- Database ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bottleneck_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=TempPass2026!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# create = drop and recreate all tables on startup (use for first run)
# update = keep existing data, only add missing tables/columns (use after first run)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080

# --- Logging ---
logging.level.com.bottleneck=INFO
